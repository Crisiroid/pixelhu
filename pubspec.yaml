name: pixelhu
description: "PixelHu - Create beautiful pixel art with easy-to-use drawing tools. Save, edit & export your creations!"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.3
  gal: ^2.3.2
  google_mobile_ads: ^5.3.1
  change_app_package_name: ^1.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true




